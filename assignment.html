<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sierpinski Triangle</title>
</head>
<body>
    <canvas id="gl-canvas" width="512" height="512">
        브라우저가 캔버스를 지원하지 않습니다.
    </canvas>
    
    <div style="margin-top: 10px;">
        <label for="subdivision-slider">분할 단계:</label>
        <input type="range" id="subdivision-slider" min="0" max="7" value="3" step="1">
        <span id="slider-value">3</span>
    </div>
    
    <div style="margin-top: 10px;">
        <label for="triangle-color">색상:</label>
        <input type="color" id="triangle-color" value="#4f46e5">
    </div>

    <!-- GLSL Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec2 a_position;
        void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
        }
    </script>

    <!-- GLSL Fragment Shader -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        uniform vec4 u_color;
        void main() {
            gl_FragColor = u_color;
        }
    </script>

    <!-- WebGL Script -->
    <script>
        "use strict";

        let gl, program, bufferId, positionAttributeLocation, colorUniformLocation;
        let numSubdivisions = 3;
        let triangleColor = [0.31, 0.27, 0.90, 1.0];
        let points = [];

        const initialVertices = [
            [-0.85, -0.75],
            [ 0.00,  0.85],
            [ 0.85, -0.75]
        ];

        window.onload = function init() {
            const canvas = document.getElementById("gl-canvas");
            
            gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
            if (!gl) {
                alert("WebGL을 지원하지 않습니다.");
                return;
            }

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(1.0, 1.0, 1.0, 1.0); // 배경을 흰색으로 변경

            program = initShaders(gl, "vertex-shader", "fragment-shader");
            if (!program) return;
            gl.useProgram(program);

            bufferId = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, bufferId);

            positionAttributeLocation = gl.getAttribLocation(program, "a_position");
            gl.enableVertexAttribArray(positionAttributeLocation);
            gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

            colorUniformLocation = gl.getUniformLocation(program, "u_color");

            setupEventListeners();
            render();
        };

        function addTriangle(a, b, c) {
            points.push(a[0], a[1], b[0], b[1], c[0], c[1]);
        }

        function mix(u, v, weight = 0.5) {
            return [
                (1 - weight) * u[0] + weight * v[0],
                (1 - weight) * u[1] + weight * v[1]
            ];
        }

        function divideTriangle(a, b, c, count) {
            if (count === 0) {
                addTriangle(a, b, c);
                return;
            }

            const ab = mix(a, b, 0.5);
            const bc = mix(b, c, 0.5);
            const ca = mix(c, a, 0.5);

            divideTriangle(a, ab, ca, count - 1);
            divideTriangle(ab, b, bc, count - 1);
            divideTriangle(ca, bc, c, count - 1);
        }

        function render() {
            points = [];
            divideTriangle(initialVertices[0], initialVertices[1], initialVertices[2], numSubdivisions);

            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.bindBuffer(gl.ARRAY_BUFFER, bufferId);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(points), gl.STATIC_DRAW);

            gl.uniform4fv(colorUniformLocation, triangleColor);
            gl.drawArrays(gl.TRIANGLES, 0, points.length / 2);
        }

        function setupEventListeners() {
            const slider = document.getElementById("subdivision-slider");
            const sliderValDisplay = document.getElementById("slider-value");

            slider.addEventListener("input", (e) => {
                numSubdivisions = parseInt(e.target.value);
                sliderValDisplay.textContent = numSubdivisions;
                render();
            });

            document.getElementById("triangle-color").addEventListener("input", (e) => {
                triangleColor = hexToRgbNormalized(e.target.value);
                render();
            });
        }

        function hexToRgbNormalized(hex) {
            let cleanHex = hex.replace("#", "");
            if (cleanHex.length === 3) cleanHex = cleanHex.split("").map(c => c + c).join("");
            const num = parseInt(cleanHex, 16);
            return [
                ((num >> 16) & 255) / 255.0,
                ((num >> 8) & 255) / 255.0,
                (num & 255) / 255.0,
                1.0
            ];
        }

        function initShaders(gl, vShaderId, fShaderId) {
            const vertElem = document.getElementById(vShaderId);
            const fragElem = document.getElementById(fShaderId);
            if (!vertElem || !fragElem) return null;

            const vertShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertShader, vertElem.textContent);
            gl.compileShader(vertShader);

            const fragShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragShader, fragElem.textContent);
            gl.compileShader(fragShader);

            const prog = gl.createProgram();
            gl.attachShader(prog, vertShader);
            gl.attachShader(prog, fragShader);
            gl.linkProgram(prog);

            return prog;
        }
    </script>
</body>
</html>
